<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB 3DS·B - Repaso de Classroom</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg);
            color: var(--text-main); 
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            text-align: center;
            padding: 50px 20px;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
        }

        header p {
            margin-top: 10px;
            font-size: 1.1rem;
            opacity: 0.92;
        }

        .container { 
            max-width: 900px; 
            margin: -30px auto 50px auto; 
            padding: 0 20px;
        }

        .grid { display: grid; gap: 25px; }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, #4f46e5, #06b6d4);
        }

        .card h3 { 
            margin-top: 0; 
            color: var(--text-main); 
            font-size: 1.4rem; 
        }

        .docente-badge { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 15px;
        }

        .resumen {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.98rem;
        }

        .tools-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .tools-list span { 
            background: #f1f5f9; 
            color: #334155;
            padding: 5px 12px; 
            border-radius: 8px; 
            margin-right: 6px; 
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            border: 1px solid #e2e8f0;
        }

        .quiz-box {
            margin-top: 20px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .quiz-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .quiz-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .quiz-pregunta {
            font-size: 0.92rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 10px;
        }

        .quiz-opciones {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-quiz {
            width: 100%;
            text-align: left;
            background: white;
            border: 1.5px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-quiz:hover { 
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
        }

        .resultado-msg {
            margin-top: 8px;
            font-weight: 700;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>HUB 3DS·B</h1>
        <p>Plataforma Modular — Información y Quizzes Oficiales de Classroom</p>
    </header>

    <div class="container">
        <div id="contenedor-modulos" class="grid">Cargando módulos...</div>
    </div>

    <script src="data/modulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contenedor = document.getElementById("contenedor-modulos");

            if (typeof modulosData !== "undefined" && Array.isArray(modulosData)) {
                contenedor.innerHTML = "";
                
                modulosData.forEach((mod, modIdx) => {
                    const card = document.createElement("div");
                    card.className = "card";

                    let herramientasHtml = mod.herramientas.map(h => `<span>${h}</span>`).join("");

                    let quizzesHtml = "";
                    mod.quizzes.forEach((q, qIdx) => {
                        let opcionesHtml = q.opciones.map((opc, opcIdx) => `
                            <button class="btn-quiz" id="btn-${modIdx}-${qIdx}-${opcIdx}" onclick="evaluarQuiz(${modIdx}, ${qIdx}, ${opcIdx}, ${q.correcta})">
                                ${opc}
                            </button>
                        `).join("");

                        quizzesHtml += `
                            <div class="quiz-item">
                                <div class="quiz-pregunta">Pregunta ${qIdx + 1}: ${q.pregunta}</div>
                                <div class="quiz-opciones" id="opciones-${modIdx}-${qIdx}">${opcionesHtml}</div>
                                <div id="res-${modIdx}-${qIdx}" class="resultado-msg"></div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <h3>${mod.nombre}</h3>
                        <div class="docente-badge">👨‍🏫 Docente: ${mod.docente}</div>
                        <p class="resumen">${mod.resumen}</p>
                        
                        <div class="tools-title">Tareas y Herramientas Asociadas</div>
                        <div class="tools-list">${herramientasHtml}</div>

                        <div class="quiz-box">
                            <div style="font-weight: 700; color: #1e293b; margin-bottom: 12px;">📝 Quizzes de Repaso del Módulo</div>
                            ${quizzesHtml}
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            } else {
                contenedor.innerHTML = "<p style='color: red; text-align: center;'>Error al cargar modulos.js</p>";
            }
        });

        function evaluarQuiz(modIdx, qIdx, eleccion, correcta) {
            const resDiv = document.getElementById(`res-${modIdx}-${qIdx}`);
            
            // Restablecer colores de botones de esta pregunta específica
            const totalOpciones = document.querySelectorAll(`#opciones-${modIdx}-${qIdx} .btn-quiz`);
            totalOpciones.forEach((btn, i) => {
                btn.style.background = "white";
                btn.style.borderColor = "#e2e8f0";
                if (i === correcta) {
                    btn.style.borderColor = "#16a34a";
                }
            });

            if (eleccion === correcta) {
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.background = "#dcfce7";
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.borderColor = "#16a34a";
                resDiv.style.color = "#16a34a";
                resDiv.innerHTML = "✅ ¡Correcto!";
            } else {
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.background = "#fee2e2";
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.borderColor = "#dc2626";
                resDiv.style.color = "#dc2626";
                resDiv.innerHTML = "❌ Incorrecto. Puedes intentar con otra opción.";
            }
        }
    </script>
</body>
</html>
