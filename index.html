<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB 3DS·B - Repaso 2026</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333; 
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            color: #1e3c72; 
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .grid { display: grid; gap: 20px; }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
            border-left: 6px solid #4facfe;
        }
        .card h3 { margin-top: 0; color: #2a5298; font-size: 1.3rem; }
        .docente { 
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .tools { font-size: 0.9rem; color: #555; margin-top: 10px; }
        .tools span { 
            background: #f1f5f9; 
            padding: 3px 8px; 
            border-radius: 4px; 
            margin-right: 5px; 
            display: inline-block;
            margin-bottom: 5px;
        }
        .quiz-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .quiz-box p { font-weight: bold; color: #1e293b; margin-top: 0; }
        .quiz-opcion {
            display: block;
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quiz-opcion:hover { background: #e2e8f0; }
        .resultado-quiz {
            margin-top: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HUB 3DS·B - Módulos del Repaso 2026</h1>
        <div id="contenedor-modulos" class="grid">Cargando módulos...</div>
    </div>

    <script src="data/modulos.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const contenedor = document.getElementById("contenedor-modulos");
            
            if (typeof modulosData !== "undefined" && Array.isArray(modulosData)) {
                contenedor.innerHTML = "";
                modulosData.forEach((modulo, index) => {
                    const div = document.createElement("div");
                    div.className = "card";
                    
                    let herramientasHtml = "";
                    if (modulo.herramientas && Array.isArray(modulo.herramientas)) {
                        herramientasHtml = modulo.herramientas.map(h => `<span>${h}</span>`).join("");
                    }
                    
                    let opcionesHtml = "";
                    if (modulo.quiz && modulo.quiz.opciones) {
                        modulo.quiz.opciones.forEach((opcion, i) => {
                            opcionesHtml += `<button class="quiz-opcion" onclick="verificarRespuesta(${index}, ${i}, ${modulo.quiz.correcta}, 'res-${index}')">${opcion}</button>`;
                        });
                    }
                    
                    div.innerHTML = `
                        <h3>${modulo.nombre}</h3>
                        <div class="docente">👨‍🏫 Docente: ${modulo.docente}</div>
                        <p>${modulo.resumen}</p>
                        <div class="tools"><strong>Herramientas:</strong> <br>${herramientasHtml}</div>
                        
                        <div class="quiz-box">
                            <p>📝 Quiz Rápido:</p>
                            <p>${modulo.quiz ? modulo.quiz.pregunta : ''}</p>
                            ${opcionesHtml}
                            <div id="res-${index}" class="resultado-quiz"></div>
                        </div>
                    `;
                    contenedor.appendChild(div);
                });
            } else {
                contenedor.innerHTML = "<p style='color: red; text-align: center;'>No se pudo cargar el archivo modulos.js correctamente.</p>";
            }
        });

        function verificarRespuesta(modIndex, opcElegida, opcCorrecta, elementoId) {
            const resultadoDiv = document.getElementById(elementoId);
            if (opcElegida === opcCorrecta) {
                resultadoDiv.style.color = "#16a34a";
                resultadoDiv.innerHTML = "¡Correcto! 🎉 Excelente respuesta.";
            } else {
                resultadoDiv.style.color = "#dc2626";
                resultadoDiv.innerHTML = "Incorrecto ❌ Inténtalo de nuevo.";
            }
        }
    </script>
</body>
</html>
