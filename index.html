<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB 3DS·B - Plataforma Educativa 2026</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #06b6d4;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg);
            color: var(--text-main); 
            min-height: 100vh;
        }

        /* Header llamativo */
        header {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            text-align: center;
            padding: 50px 20px;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            margin-top: 10px;
            font-size: 1.1rem;
            opacity: 0.92;
        }

        .container { 
            max-width: 900px; 
            margin: -30px auto 50px auto; 
            padding: 0 20px;
        }

        .grid { display: grid; gap: 25px; }

        /* Targetas modernas */
        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, #4f46e5, #06b6d4);
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04); 
        }

        .card h3 { 
            margin-top: 0; 
            color: var(--text-main); 
            font-size: 1.4rem; 
            line-height: 1.3;
        }

        /* Badge Docente */
        .docente-badge { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 15px;
        }

        .resumen {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.98rem;
        }

        /* Tags de herramientas */
        .tools-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .tools-list span { 
            background: #f1f5f9; 
            color: #334155;
            padding: 5px 12px; 
            border-radius: 8px; 
            margin-right: 6px; 
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            border: 1px solid #e2e8f0;
        }

        /* Caja interactiva de Quiz */
        .quiz-box {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .quiz-pregunta {
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 12px;
        }

        .quiz-opciones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-quiz {
            width: 100%;
            text-align: left;
            background: white;
            border: 1.5px solid #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-quiz:hover { 
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
        }

        .resultado-msg {
            margin-top: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>HUB 3DS·B</h1>
        <p>Plataforma Modular Educativa — Repaso 2026</p>
    </header>

    <div class="container">
        <div id="contenedor-modulos" class="grid">Cargando módulos...</div>
    </div>

    <script src="data/modulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contenedor = document.getElementById("contenedor-modulos");

            if (typeof modulosData !== "undefined" && Array.isArray(modulosData)) {
                contenedor.innerHTML = "";
                
                modulosData.forEach((mod, idx) => {
                    const card = document.createElement("div");
                    card.className = "card";

                    let herramientasHtml = mod.herramientas.map(h => `<span>${h}</span>`).join("");

                    let opcionesHtml = mod.opciones.map((opc, i) => `
                        <button class="btn-quiz" onclick="evaluarQuiz(${idx}, ${i}, ${mod.correcta})">
                            ${opc}
                        </button>
                    `).join("");

                    card.innerHTML = `
                        <h3>${mod.nombre}</h3>
                        <div class="docente-badge">👨‍🏫 Docente: ${mod.docente}</div>
                        <p class="resumen">${mod.resumen}</p>
                        
                        <div class="tools-title">Tecnologías y herramientas</div>
                        <div class="tools-list">${herramientasHtml}</div>

                        <div class="quiz-box">
                            <div class="quiz-header">📝 Evaluation & Quiz</div>
                            <div class="quiz-pregunta">${mod.pregunta}</div>
                            <div class="quiz-opciones">${opcionesHtml}</div>
                            <div id="res-${idx}" class="resultado-msg"></div>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            } else {
                contenedor.innerHTML = "<p style='color: red; text-align: center;'>Error al cargar modulos.js</p>";
            }
        });

        function evaluarQuiz(modIdx, eleccion, correcta) {
            const resDiv = document.getElementById(`res-${modIdx}`);
            if (eleccion === correcta) {
                resDiv.style.color = "#16a34a";
                resDiv.innerHTML = "✅ ¡Respuesta Correcta! Excelente trabajo.";
            } else {
                resDiv.style.color = "#dc2626";
                resDiv.innerHTML = "❌ Respuesta Incorrecta. Revisa el contenido e inténtalo de nuevo.";
            }
        }
    </script>
</body>
</html>
