<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB 3DS·B - Plataforma de Repaso 2026</title>
   <style>
:root{
  --bg:#050711; --panel:rgba(15, 23, 42, 0.75); --panel2:rgba(11, 17, 36, 0.85); 
  --line:rgba(51, 65, 122, 0.4); --line2:rgba(34, 211, 238, 0.3);
  --tx:#f1f5f9; --mut:#94a3b8;
  --cy:#38bdf8; --mg:#e879f9; --am:#fbbf24; --gr:#4ade80;
  --fd:'Orbitron', system-ui, sans-serif;
  --fb:'Exo 2', system-ui, sans-serif;
  --fm:'JetBrains Mono', monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.7;font-size:16px; background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(232, 121, 249, 0.06) 0%, transparent 40%); background-attachment: fixed;}

/* Barra superior elegante con efecto vidrio difuminado */
nav.top{position:sticky;top:0;z-index:100;background:rgba(5, 7, 17, 0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px;max-width:1100px;margin:0 auto;padding:0 20px}
nav.top .marca{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--cy);letter-spacing:0.5px;margin-right:auto}
nav.top a.lnk{color:var(--mut);text-decoration:none;font-size:14px;font-weight:500;transition:color 0.2s}
nav.top a.lnk:hover{color:var(--cy)}

.btn-pdf{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;font:600 13px var(--fb);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 12px rgba(56,189,248,0.25);transition:all 0.2s}
.btn-pdf:hover{transform:translateY(-1px);filter:brightness(1.1)}

/* Portada sofisticada */
.hero{padding:70px 0 50px;border-bottom:1px solid var(--line);text-align:center;}
.hero .wrap{max-width:850px;margin:0 auto;padding:0 20px;}
.inst{color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;font-weight:600}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(32px, 5vw, 50px);line-height:1.15;background:linear-gradient(135deg,#fff 30%,var(--cy) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;}
.lead{color:var(--mut);font-size:18px;max-width:65ch;margin:0 auto 30px;}

/* Tarjetas y contenedores con armonía visual */
.bloque{padding:60px 0;border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
h2{font-family:var(--fd);font-weight:700;font-size:clamp(22px, 3vw, 28px);margin-bottom:10px;color:#f8fafc}
.intro{color:var(--mut);margin-bottom:35px;font-size:16px}

/* Grid de módulos y misiones */
.entregas, .logica {display:grid;grid-template-columns:repeat(auto-fit, minmax(310px, 1fr));gap:24px}
.card, .ent, .lg, .proy{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;backdrop-filter:blur(8px);box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);transition:transform 0.3s, border-color 0.3s;}
.card:hover, .ent:hover, .lg:hover{transform:translateY(-4px);border-color:var(--line2)}

/* Estilo para los botones de Quiz y Filtros */
.btn-quiz, .chip{background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:10px;cursor:pointer;font-family:var(--fb);font-weight:600;transition:all 0.2s}
.btn-quiz:hover, .chip:hover{background:rgba(56,189,248,0.1);border-color:var(--cy);color:var(--cy)}

/* Footer profesional */
footer{padding:40px 0 60px;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
footer b{color:var(--tx)}
</style>
</head>
<body>

    <header>
        <h1>HUB 3DS·B</h1>
        <p>Plataforma Académica Modular — Repaso de Contenidos 2026</p>
    </header>

    <div class="container">
        <div id="contenedor-modulos" class="grid">Cargando módulos...</div>
    </div>

    <script src="data/modulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contenedor = document.getElementById("contenedor-modulos");

            if (typeof modulosData !== "undefined" && Array.isArray(modulosData)) {
                contenedor.innerHTML = "";
                
                modulosData.forEach((mod, modIdx) => {
                    const card = document.createElement("div");
                    card.className = "card";

                    let herramientasHtml = mod.herramientas.map(h => `<span>${h}</span>`).join("");

                    let docenteClass = mod.docente.includes("Arcides") ? "docente-arcides" : "docente-mineros";

                    let quizzesHtml = "";
                    if (mod.quizzes && Array.isArray(mod.quizzes)) {
                        mod.quizzes.forEach((q, qIdx) => {
                            let opcionesHtml = q.opciones.map((opc, opcIdx) => `
                                <button class="btn-quiz" id="btn-${modIdx}-${qIdx}-${opcIdx}" onclick="evaluarQuiz(${modIdx}, ${qIdx}, ${opcIdx}, ${q.correcta})">
                                    ${opc}
                                </button>
                            `).join("");

                            quizzesHtml += `
                                <div class="quiz-item">
                                    <div class="quiz-pregunta">Pregunta ${qIdx + 1}: ${q.pregunta}</div>
                                    <div class="quiz-opciones" id="opciones-${modIdx}-${qIdx}">${opcionesHtml}</div>
                                    <div id="res-${modIdx}-${qIdx}" class="resultado-msg"></div>
                                </div>
                            `;
                        });
                    }

                    card.innerHTML = `
                        <h3>${mod.nombre}</h3>
                        <div class="docente-badge ${docenteClass}">👨‍🏫 Docente: ${mod.docente}</div>
                        <p class="resumen">${mod.resumen}</p>
                        
                        <div class="tools-title">Tareas y Herramientas Asociadas</div>
                        <div class="tools-list">${herramientasHtml}</div>

                        <div class="quiz-box">
                            <div style="font-weight: 700; color: #1e293b; margin-bottom: 12px;">📝 Cuestionario de Evaluación</div>
                            ${quizzesHtml}
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            } else {
                contenedor.innerHTML = "<p style='color: red; text-align: center;'>Error al cargar el archivo modulos.js</p>";
            }
        });

        function evaluarQuiz(modIdx, qIdx, eleccion, correcta) {
            const resDiv = document.getElementById(`res-${modIdx}-${qIdx}`);
            
            const totalOpciones = document.querySelectorAll(`#opciones-${modIdx}-${qIdx} .btn-quiz`);
            totalOpciones.forEach((btn, i) => {
                btn.style.background = "white";
                btn.style.borderColor = "#e2e8f0";
                if (i === correcta) {
                    btn.style.borderColor = "#16a34a";
                }
            });

            if (eleccion === correcta) {
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.background = "#dcfce7";
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.borderColor = "#16a34a";
                resDiv.style.color = "#16a34a";
                resDiv.innerHTML = "✅ ¡Respuesta correcta!";
            } else {
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.background = "#fee2e2";
                document.getElementById(`btn-${modIdx}-${qIdx}-${eleccion}`).style.borderColor = "#dc2626";
                resDiv.style.color = "#dc2626";
                resDiv.innerHTML = "❌ Respuesta incorrecta. Puedes intentar con otra opción.";
            }
        }
    </script>
</body>
</html>
